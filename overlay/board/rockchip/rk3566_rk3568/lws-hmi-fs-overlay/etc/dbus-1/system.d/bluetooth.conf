<!--
  BlueZ system-bus policy. Buildroot/Rockchip images sometimes ship bluetoothd
  without this file; without it bluetoothd cannot own org.bluez.
  AgentManager1 is required for bluetoothctl / bt-pair-agent RegisterAgent.
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.bluez"/>
    <allow send_destination="org.bluez"/>
    <allow send_interface="org.bluez.AgentManager1"/>
    <allow send_interface="org.bluez.AdvertisementMonitor1"/>
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.bluez.Profile1"/>
    <allow send_interface="org.bluez.GattCharacteristic1"/>
    <allow send_interface="org.bluez.GattDescriptor1"/>
    <allow send_interface="org.bluez.LEAdvertisement1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.mpris.MediaPlayer2.Player"/>
    <!-- Allow bluetoothd to invoke Agent1 on other root clients (HMI / bluetoothctl). -->
    <allow send_destination="*"/>
    <allow receive_sender="org.bluez"/>
    <allow receive_interface="org.bluez.Agent1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
