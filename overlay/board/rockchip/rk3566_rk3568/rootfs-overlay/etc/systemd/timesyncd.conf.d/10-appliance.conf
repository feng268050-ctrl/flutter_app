# Appliance NTP: default FallbackNTP is Google (time*.google.com). On many CN
# LANs UDP/123 to those hosts times out while HTTPS/HTTP still works — Settings
# "Automatic" then appears to work (one-shot HTTP Date ladder) but the clock
# drifts again because timesyncd never locks. Prefer reachable CN servers first.
[Time]
NTP=ntp.aliyun.com ntp.tencent.com ntp.ntsc.ac.cn
FallbackNTP=cn.pool.ntp.org time.cloudflare.com
