# BlueZ defaults — discoverable peer + A2DP Sink (phone music → speaker).
[General]
# Default system name before Alias is set. Phones use Adapter1.Alias once set.
# Override at runtime: LWS_BT_ALIAS or /var/lib/bluetooth/adapter-alias (see bt-set-alias.sh).
Name = lws-hmi
# Audio/Video Loudspeaker (service Audio+Rendering) so phones treat us as a BT speaker.
Class = 0x240414
DiscoverableTimeout = 180
PairableTimeout = 0
JustWorksRepairing = always
Privacy = off
FastConnectable = true
# Phone→HMI pairing: do NOT reverse-SDP-browse the phone. On AIC8800 that path
# returns ENOSYS (38) / Host is down (112) and iPhone shows 连接失败 even after
# a valid PIN. We only need LOCAL SDP (Audio Sink via bluealsa MediaEndpoint).
ReverseServiceDiscovery = false
# Also skip SDP refresh when a profile later connects.
RefreshDiscovery = false
# AIC8800 mgmt rejects ControllerMode=bredr ("Failed to set mode: Not Supported").
# Keep default dual.
# ControllerMode = dual
# Omit KernelExperimental (BlueZ 5.77 mis-parses "= false" as a UUID).
Experimental = false

[Policy]
AutoEnable = true
# After link loss: phone A2DP Source + AVRCP (we are Sink), Classic HID, HOGP.
ReconnectUUIDs = 0000110a-0000-1000-8000-00805f9b34fb,0000110e-0000-1000-8000-00805f9b34fb,00001124-0000-1000-8000-00805f9b34fb,00001812-0000-1000-8000-00805f9b34fb
# BLE keyboards often drop the LE link when idle; BlueZ Policy reconnect is primary
# while Trusted (Trusted + ReconnectUUIDs). User Disconnect = Untrust + Disconnect
# (sticky). Connect = Trust + Connect. HAL attaches HOGP/evdev when Connected;
# sticky LE (Connected, no ServicesResolved / no evdev) refreshes with the same
# Untrust/Disconnect/Trust/Connect cycle. HAL rechecks ~15s and auto-ensures
# Connected-but-not-ready (45s cooldown); Demo Reconnect is fallback only.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
