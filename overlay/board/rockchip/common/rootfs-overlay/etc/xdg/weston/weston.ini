# Panel 800x1280 portrait. rotate-270 matches landscape (lcd0_rotation=90)
# (rotate-90 appeared 180° upside-down on ynh960).
# Client: --fullscreen only, do NOT also --rotation=.
# Note: Rockchip 10-weston may overwrite this path; hmi-launch.sh passes
# --config with a runtime copy so transform always applies.
# desktop-shell: background-image bridges kernel splash → Flutter first frame
# (kiosk-shell only supports solid background-color).
# boot-splash.png is icon-sized (make build-boot-logo); pad + black fill centers
# on any output — not a panel-resolution canvas.

[core]
backend=drm-backend.so
shell=desktop-shell.so
idle-time=0

[shell]
locking=false
animation=none
startup-animation=none
panel-position=none
background-image=/usr/share/hmi/boot-splash.png
background-type=pad
background-color=0xff000000

[keyboard]
repeat-rate=25
repeat-delay=500

# Product soft IME is CyberIME. Empty path= still falls back to
# @libexecdir@/weston-keyboard on Weston 14.0.1 — use a non-executable
# sentinel so the client is never started.
[input-method]
path=/bin/false

[output]
name=DSI-1
mode=800x1280
transform=rotate-270
