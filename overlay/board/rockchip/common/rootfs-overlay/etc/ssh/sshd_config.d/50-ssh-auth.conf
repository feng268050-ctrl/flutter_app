# Shared OpenSSH settings for USB plug-ssh and LAN SSH debug.
# Loaded first via post-fakeroot Include (OpenSSH first-match wins).
# Do not set ListenAddress here: USB plug-ssh passes -o ListenAddress=192.168.55.1;
# LAN debug passes -o ListenAddress=<eth0/wlan0> via lan-ssh-run.sh.
# Boot-time sshd.service stays disabled via systemd preset.
Banner /etc/issue.net
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# Local -L only (host debug port-forward); deny remote forwards.
AllowTcpForwarding local
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
LogLevel VERBOSE
MaxAuthTries 3
MaxSessions 2
