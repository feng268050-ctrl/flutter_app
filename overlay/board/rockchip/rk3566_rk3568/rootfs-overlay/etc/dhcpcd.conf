# dhcpcd — wlan0 client DHCP (helpers only; no boot service).
# Prefer clientid over duid: many consumer APs ignore DUID-based DHCP.
hostname
clientid
persistent
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option rapid_commit
# IPv4-only HMI Wi-Fi for Demo / P5.2 later.
noipv6
noipv6rs
# Only touch wireless ifaaces when started for wlan*; never eth0/usb0.
allowinterfaces wlan*
