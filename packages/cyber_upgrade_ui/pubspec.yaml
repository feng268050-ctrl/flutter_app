name: cyber_upgrade_ui
description: >
  Shared upgrade UX for LWS product HMIs — version-check card/dialog,
  multi-phase progress, completion tips, and pluggable check strategy.
  Not an apply engine (see cyber_ota) and not HAL.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cyber_ui:
    path: ../cyber_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
