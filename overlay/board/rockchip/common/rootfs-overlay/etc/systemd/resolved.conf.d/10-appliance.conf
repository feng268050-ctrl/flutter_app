# Appliance DNS: systemd-resolved is the product DNS path (D11 with networkd).
# Keep discovery noise off on a single-UI embedded image.
#
# Wall clock: external PCF8563 (rtc0) + systemd-timesyncd preset-enabled; the old
# RK809 PMIC RTC skew issue is fixed in kernel/DT. DNSSEC validation is safe once
# time is sane (Automatic NTP default on; one-shot ladder for TLS bootstrap).
[Resolve]
# Lynis NAME-4028: publish a DNS domain on the resolved stub (Avahi uses .local).
Domains=local
# Curated fallbacks when link/DHCP DNS is empty or single-homed (Cloudflare + Google).
FallbackDNS=1.1.1.1 8.8.8.8
LLMNR=no
MulticastDNS=no
# Validate when upstream supports DNSSEC; do not hard-fail on legacy resolvers.
DNSSEC=allow-downgrade
DNSOverTLS=no
