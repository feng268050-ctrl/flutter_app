# Appliance hardening (Lynis USB-1000 / NETW-3200).
# Product does not use external USB thumb drives; plug-ssh (g_ether), MTP
# (FunctionFS), and USB host HID are unrelated to usb-storage.

install usb-storage /bin/false
blacklist usb-storage

install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
