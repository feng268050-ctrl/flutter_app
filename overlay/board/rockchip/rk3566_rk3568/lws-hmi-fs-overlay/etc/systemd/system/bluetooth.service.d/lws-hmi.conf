# Override bluetoothd: Classic A2DP-first plugin set (no battery GATT side-paths).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=battery
# Quiet: ConfigurationDirectory 'bluetooth' already exists but mode is different.
ConfigurationDirectoryMode=0755
# Allow realtime-ish networking for media; keep other lockdown from upstream unit.
RestrictRealtime=false
# HOGP/device teardown has historically aborted bluetoothd (heap corruption).
# Recover without requiring the HMI to toggle the adapter.
Restart=on-abnormal
RestartSec=2
StartLimitIntervalSec=60
StartLimitBurst=5
