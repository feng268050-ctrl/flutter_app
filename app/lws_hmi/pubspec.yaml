name: lws_hmi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# System Version: 5-digit build = major*10000+minor*100+patch (1.0.40 → 10040). See lib/app_version.dart.
version: 1.0.41+10041

environment:
  sdk: ^3.5.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Portable Dart HAL (board profiles, Linux backends). Path dep until published.
  cyber_hal:
    path: ../../packages/cyber_hal

  # CyberUI chrome (Frosted Glass). Path dep until published / submodule.
  cyber_ui:
    path: ../../packages/cyber_ui

  # CyberIME overlay keyboard. Path dep until published / submodule.
  cyber_ime:
    path: ../../packages/cyber_ime

  # Shared warn/alarm episode engine (path dep).
  cyber_alarm:
    path: ../../packages/cyber_alarm

  # Child-process supervisor (MediaMTX, future AI). Path dep.
  cyber_pm:
    path: ../../packages/cyber_pm

  # Whole-device OTA orchestration (manifest, staged apply). Path dep.
  cyber_ota:
    path: ../../packages/cyber_ota

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Modbus RTU: Linux prefers PosixSerialPort (stty+libc) because Buildroot
  # libserialport 0.1.1 hits ENOTTY on kernel 6.1 (termiox); keep this for
  # Android / fallback. Rootfs still ships BR2_PACKAGE_LIBSERIALPORT.
  flutter_libserialport: ^0.4.0
  ffi: ^2.1.0
  bluez: ^0.8.3
  dbus: ^0.7.12
  qr_flutter: ^4.1.0
  video_player: 2.9.5
  video_player_platform_interface: ^6.2.0
  flutterpi_gstreamer_video_player: 0.1.1+1
  sqlite3: ^2.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # UI click SFX (lws-ui click_mp3_2 / click_mp3 / click_mp3_1 → Effect 1/2/3).
    - assets/audio/click_effect_1.mp3
    - assets/audio/click_effect_2.mp3
    - assets/audio/click_effect_3.mp3
    # Warn dialog loop (lws-ui res/raw/warn_mp3.mp3).
    - assets/audio/warn_mp3.mp3
    # Warn dialog icons (lws-ui mipmap alarm_warn_icon / alarm_info_icon).
    - assets/warn/alarm_warn_icon.webp
    - assets/warn/alarm_info_icon.webp
    # Alarm log row siren + Clear pill trash (lws-ui warn_icon / alarm_button_icon).
    - assets/warn/warn_icon.webp
    - assets/warn/alarm_button_icon.webp
    # Product HAL pack (board profile + gpio/modbus catalogs).
    - assets/hal/board_profile.json
    - assets/hal/gpio.json
    - assets/hal/gpio.sim.json
    - assets/hal/modbus.json
    # Ship-only (make prepare-app-assets / build-app): newest firmware per HW +
    # newest process-library JSON per model. Sources: assets/firmware/control-board/
    # and assets/process-library/<model>/*.xlsx (not declared here).
    # Flutter packs only *direct* files under each listed dir — model subdirs
    # are rewritten by prepare-hmi-ship-assets.sh between the markers below.
    # BEGIN generated-ship-assets
    - assets/.generated/firmware/control-board/
    - assets/.generated/process-library/
    - assets/.generated/process-library/L1_Pro/
    # END generated-ship-assets
    # Product Home backdrop / heroes (from lws-ui mipmap-mdpi).
    - assets/home/home_back.webp
    - assets/home/home_left_1m.webp
    - assets/home/home_right_1m.webp
    - assets/home/home_left_img.webp
    - assets/home/home_right_img.webp
    - assets/home/home_fast.webp
    - assets/home/home_engine.webp
    - assets/home/home_fast_text_en.webp
    - assets/home/home_engine_text_en.webp
    - assets/home/home_settings.webp
    - assets/home/home_monitor.webp
    - assets/home/ai_vision_home.webp
    # Custom Home editor shell + card frames (lws-ui mipmap-xxxhdpi WebP stack).
    - assets/settings/custom_home/
    # Work-mode status bar icons (from lws-ui EquipmentStatusBar mipmaps).
    - assets/work-mode/
    # Process-mode chrome (Quick wheel / Engineer tabs; from lws-ui mipmap-xxxhdpi).
    - assets/process/
    - assets/process/laser_reminder/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
