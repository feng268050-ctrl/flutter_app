# Shared OpenSSH settings for USB plug-ssh and LAN SSH debug.
# Do not set ListenAddress here: USB plug-ssh passes -o ListenAddress=192.168.55.1;
# LAN debug passes -o ListenAddress=<eth0/wlan0> via lan-ssh-run.sh.
# Boot-time sshd.service stays disabled via systemd preset.
PasswordAuthentication yes
PermitRootLogin yes
