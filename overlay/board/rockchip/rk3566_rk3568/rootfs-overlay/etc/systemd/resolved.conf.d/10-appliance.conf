# Appliance DNS: systemd-resolved is the product DNS path (D11 with networkd).
# Keep discovery noise off on a single-UI embedded image.
#
# DNSSEC/DoT need a sane wall clock. Until timesyncd (or other NTP) lands, the
# RTC is often years off at first boot → DNSSEC signature-expired → all lookups
# fail while IP ping still works. Disable until time sync is a product feature.
[Resolve]
LLMNR=no
MulticastDNS=no
DNSSEC=no
DNSOverTLS=no
