# Appliance DNS: systemd-resolved is the product DNS path (D11 with networkd).
# Keep discovery noise off on a single-UI embedded image.
#
# systemd-timesyncd is enabled for continuous NTP, but first boot can still have
# a years-off RTC before NTP locks. DNSSEC/DoT stay off until that path is proven
# (signature-expired would break all lookups while IP ping still works).
[Resolve]
LLMNR=no
MulticastDNS=no
DNSSEC=no
DNSOverTLS=no
